<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出師表：蜀漢危機</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f2eee5;
            color: #332b22;
            text-align: center;
        }

        .game {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-top: 80px;
        }

        .subtitle {
            font-size: 20px;
            margin: 20px 0 50px;
        }

        .quote {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        button {
            font-size: 20px;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🏯 出師表：蜀漢危機</h1>

    <div class="subtitle">
        西元 227 年，你現在是劉禪。
    </div>

    <div class="quote">
        「先帝創業未半，而中道崩殂……」
        <br><br>
        諸葛亮即將率軍北伐。
        <br>
        蜀漢的命運，交給你決定。
    </div>

    <button onclick="startGame()">
        開始遊戲
    </button>

</div>

<script>
function startGame() {
    alert("遊戲開始！");
}
</script>

</body>
</html>
